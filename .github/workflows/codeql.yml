name: codeql

# Static security analysis of our C++ sources.
#
# CodeQL needs to watch a real compile, so this builds the project itself instead of using
# autobuild. Third-party code fetched by CMake (raylib, nlohmann/json) is filtered out in
# .github/codeql-config.yml, so findings point at code we can actually fix.
#
# Linux, once a day (owner, 2026-10-16). On windows-latest with MSYS2 a run had grown to
# 25-45 minutes, and it ran after every merge to main as well. The Linux job builds the same
# sources with GCC in a fraction of that. What it does not see is the Windows-only branch of
# the transport (winsock), a few dozen lines behind `#ifdef _WIN32`; the build and tests on
# Windows still cover those every PR. Not run on pull requests: it never gated a merge.
on:
  schedule:
    # Daily, so newly published queries reach an unchanged codebase too.
    - cron: '31 4 * * *'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze C++
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libgl1-mesa-dev libglu1-mesa-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxkbcommon-dev \
            libxrandr-dev

      # Build the dependencies BEFORE CodeQL is watching. For a compiled language the
      # extractor takes whatever it observes being compiled, and raylib is part of our
      # build -- the first run produced 100 alerts, every one of them inside raylib's
      # bundled third-party code and none in ours. Path filters do not prevent that;
      # build order does.
      - name: Pre-build dependencies (outside the CodeQL database)
        run: |
          cmake -S . -B build-codeql -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-codeql --target raylib -j "$(nproc)"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          config-file: ./.github/codeql-config.yml

      # Dependencies are already built, so only our own sources compile here and only
      # they land in the database.
      - name: Build our sources
        run: cmake --build build-codeql -j "$(nproc)"

      - name: Analyze
        uses: github/codeql-action/analyze@v4
