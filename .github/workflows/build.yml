name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  # Style gate, in its own job so it reports independently of the build.
  #
  # It runs under MSYS2 rather than on a cheaper Ubuntu runner on purpose: clang-format
  # output differs between major versions, so checking with a different build than
  # contributors have locally would fail on code that is correctly formatted. Same
  # toolchain here as in CONTRIBUTING.
  lint:
    name: Formatting
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - name: Set up MSYS2 / clang-format
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-clang

      - name: Check formatting
        run: |
          clang-format --version
          find src tests \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  build:
    name: Windows (MinGW / MSYS2)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # No `update: true`: a full pacman upgrade on every run costs minutes and
          # pins the build to whatever landed upstream today rather than to the
          # packages we actually asked for.
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-ccache

      # raylib and nlohmann/json are fetched and compiled by CMake. They change only
      # when the pinned versions in CMakeLists.txt change, so key the cache on that
      # file: a dependency bump invalidates it, an ordinary commit does not.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      # ccache covers our own sources. CMakeLists picks it up automatically when it is
      # on PATH, so nothing else needs configuring.
      - name: Cache compiled objects
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Configure
        # -Werror only in CI: warnings stay visible but non-fatal for local work, while
        # nothing warning-dirty can reach main.
        run: cmake -S . -B build -G "MinGW Makefiles" -DWARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Server smoke tests
        run: |
          ./build/bin/server/econserver.exe hosttest
          ./build/bin/server/econserver.exe accttest
          ./build/bin/server/econserver.exe worldtest
          ./build/bin/server/econserver.exe ordertest

      # The agent seam, end to end, against a real server. Deliberately scripted rather
      # than model-driven: a real model would cost money, need a key and answer
      # differently every run, while this proves the part that can actually break --
      # the bridge, the orders, the journal and the round trip.
      - name: Agent selftest against a live server
        run: |
          ./build/bin/agent/econagent.exe || true   # usage, non-zero exit
          ./build/bin/server/econserver.exe host 50800 &
          server_pid=$!
          sleep 5
          ./build/bin/agent/econagent.exe selftest 127.0.0.1 50800
          status=$?
          kill $server_pid 2>/dev/null || true
          exit $status

      # Two clients at once, which nothing checked until #107 -- and that is why one
      # account being playable by two connections at the same time (#105) reached main.
      # Deliberately over sockets rather than in-process: the hello handler, the per-name
      # account files and the transport are exactly the parts that only exist there.
      - name: Two clients at once
        run: |
          set -e
          ./build/bin/server/econserver.exe host 50801 > mc.log 2>&1 &
          server_pid=$!
          sleep 5

          # Two people sharing a galaxy. Each has to complete its own scripted run.
          ./build/bin/agent/econagent.exe selftest 127.0.0.1 50801 alice &
          alice=$!
          ./build/bin/agent/econagent.exe selftest 127.0.0.1 50801 bob &
          bob=$!
          wait $alice
          wait $bob

          # One account, one session: a second login for a name displaces the first, and
          # the newcomer still plays normally afterwards.
          sleep 30 | ./build/bin/agent/econagent.exe connect 127.0.0.1 50801 carol >/dev/null 2>&1 &
          holder=$!
          sleep 3
          ./build/bin/agent/econagent.exe selftest 127.0.0.1 50801 carol
          kill $holder 2>/dev/null || true

          kill $server_pid 2>/dev/null || true
          sleep 1
          cat mc.log
          grep -q "displaced" mc.log

  # The second platform, and the reason the transport was portable at all (#12). Without
  # a runner that actually compiles it, "should work on Linux" is a claim nobody checks --
  # and the winsock calls it replaced were invisible from Windows.
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # raylib needs the X11/GL development headers even for a build that never opens a
      # window: the server links it for its timing and file-path helpers.
      - name: Install raylib's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache libasound2-dev libgl1-mesa-dev libglu1-mesa-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxkbcommon-dev \
            libxrandr-dev

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Cache compiled objects
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Configure
        run: cmake -S . -B build -DWARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Server smoke tests
        run: |
          ./build/bin/server/econserver hosttest
          ./build/bin/server/econserver accttest
          ./build/bin/server/econserver worldtest
          ./build/bin/server/econserver ordertest

      # The same end-to-end check the Windows job runs. A socket layer that compiles and
      # a socket layer that talks are different claims.
      - name: Agent selftest against a live server
        run: |
          ./build/bin/server/econserver host 50800 &
          server_pid=$!
          sleep 5
          ./build/bin/agent/econagent selftest 127.0.0.1 50800
          status=$?
          kill $server_pid 2>/dev/null || true
          exit $status

      # Two clients at once, which nothing checked until #107 -- and that is why one
      # account being playable by two connections at the same time (#105) reached main.
      # Deliberately over sockets rather than in-process: the hello handler, the per-name
      # account files and the transport are exactly the parts that only exist there.
      - name: Two clients at once
        run: |
          set -e
          ./build/bin/server/econserver host 50801 > mc.log 2>&1 &
          server_pid=$!
          sleep 5

          # Two people sharing a galaxy. Each has to complete its own scripted run.
          ./build/bin/agent/econagent selftest 127.0.0.1 50801 alice &
          alice=$!
          ./build/bin/agent/econagent selftest 127.0.0.1 50801 bob &
          bob=$!
          wait $alice
          wait $bob

          # One account, one session: a second login for a name displaces the first, and
          # the newcomer still plays normally afterwards.
          sleep 30 | ./build/bin/agent/econagent connect 127.0.0.1 50801 carol >/dev/null 2>&1 &
          holder=$!
          sleep 3
          ./build/bin/agent/econagent selftest 127.0.0.1 50801 carol
          kill $holder 2>/dev/null || true

          kill $server_pid 2>/dev/null || true
          sleep 1
          cat mc.log
          grep -q "displaced" mc.log
