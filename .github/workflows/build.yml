name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  # Style gate, in its own job so it reports independently of the build.
  #
  # It runs under MSYS2 rather than on a cheaper Ubuntu runner on purpose: clang-format
  # output differs between major versions, so checking with a different build than
  # contributors have locally would fail on code that is correctly formatted. Same
  # toolchain here as in CONTRIBUTING.
  lint:
    name: Formatting
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - name: Set up MSYS2 / clang-format
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-clang

      - name: Check formatting
        run: |
          clang-format --version
          find src tests \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  build:
    name: Windows (MinGW / MSYS2)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # No `update: true`: a full pacman upgrade on every run costs minutes and
          # pins the build to whatever landed upstream today rather than to the
          # packages we actually asked for.
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-ccache

      # raylib and nlohmann/json are fetched and compiled by CMake. They change only
      # when the pinned versions in CMakeLists.txt change, so key the cache on that
      # file: a dependency bump invalidates it, an ordinary commit does not.
      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      # ccache covers our own sources. CMakeLists picks it up automatically when it is
      # on PATH, so nothing else needs configuring.
      - name: Cache compiled objects
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Configure
        # -Werror only in CI: warnings stay visible but non-fatal for local work, while
        # nothing warning-dirty can reach main.
        run: cmake -S . -B build -G "MinGW Makefiles" -DWARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Server smoke tests
        timeout-minutes: 10  # a hung socket fails the run instead of holding it for hours
        run: |
          ./build/bin/server/econserver.exe hosttest
          ./build/bin/server/econserver.exe accttest
          ./build/bin/server/econserver.exe worldtest
          ./build/bin/server/econserver.exe ordertest

      # The agent seam, end to end, against a real server. Deliberately scripted rather
      # than model-driven: a real model would cost money, need a key and answer
      # differently every run, while this proves the part that can actually break --
      # the bridge, the orders, the journal and the round trip.
      - name: Agent selftest against a live server
        timeout-minutes: 10  # a hung socket fails the run instead of holding it for hours
        run: |
          ./build/bin/agent/econagent.exe || true   # usage, non-zero exit
          ./build/bin/server/econserver.exe host 50800 &
          server_pid=$!
          sleep 5
          ./build/bin/agent/econagent.exe selftest 127.0.0.1 50800
          status=$?
          kill $server_pid 2>/dev/null || true
          exit $status

      # Two clients at once, which nothing checked until #107 -- and that is why one
      # account being playable by two connections at the same time (#105) reached main.
      # Deliberately over sockets rather than in-process: the hello handler, the per-name
      # account files and the transport are exactly the parts that only exist there.
      - name: Two clients at once
        timeout-minutes: 10  # a hung socket fails the run instead of holding it for hours
        run: |
          set -e
          ./build/bin/server/econserver.exe host 50801 > mc.log 2>&1 &
          server_pid=$!
          # However this ends -- a failed check under set -e included -- stop the server
          # and show its log. A step that dies without the server's side of the story is
          # the one nobody can diagnose afterwards.
          trap 'kill $server_pid 2>/dev/null || true; echo "--- server log ---"; cat mc.log' EXIT
          # Wait for what the server says, never for a fixed time: a sleep is a guess about
          # how fast this runner is today, and a guess that is wrong once is a flaky step.
          wait_for() {
            for _ in $(seq 1 150); do grep -q "$1" mc.log && return 0; sleep 0.2; done
            echo "timed out waiting for the server to log: $1"; return 1
          }
          # Every client is bounded twice: by its own watchdog (econagent selftest gives
          # up and names what it was waiting for), and here, for a process that will not
          # exit at all.
          agent() { timeout -k 10 300 ./build/bin/agent/econagent.exe "$@"; }
          wait_for "EconSpace server on port"

          # Two people sharing a galaxy. Each has to complete its own scripted run.
          agent selftest 127.0.0.1 50801 alice alice-secret &
          alice=$!
          agent selftest 127.0.0.1 50801 bob bob-secret &
          bob=$!
          wait $alice
          wait $bob

          # One account, one session: a second login for a name displaces the first, and
          # the newcomer still plays normally afterwards. The second login waits until the
          # first has actually joined -- after a fixed three seconds it sometimes had not,
          # and then the "first" displaced the second and the check failed.
          sleep 30 | agent connect 127.0.0.1 50801 carol carol-secret >/dev/null 2>&1 &
          holder=$!
          wait_for "carol joined"
          agent selftest 127.0.0.1 50801 carol carol-secret

          # And the secret is not decoration: the wrong one is refused (#106).
          if agent selftest 127.0.0.1 50801 carol not-the-secret; then
            echo "a wrong secret was accepted"
            exit 1
          fi
          kill $holder 2>/dev/null || true
          grep -q "displaced" mc.log

  # The second platform, and the reason the transport was portable at all (#12). Without
  # a runner that actually compiles it, "should work on Linux" is a claim nobody checks --
  # and the winsock calls it replaced were invisible from Windows.
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # raylib needs the X11/GL development headers even for a build that never opens a
      # window: the server links it for its timing and file-path helpers.
      - name: Install raylib's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache libasound2-dev libgl1-mesa-dev libglu1-mesa-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxkbcommon-dev \
            libxrandr-dev

      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Cache compiled objects
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Configure
        run: cmake -S . -B build -DWARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Server smoke tests
        timeout-minutes: 10  # a hung socket fails the run instead of holding it for hours
        run: |
          ./build/bin/server/econserver hosttest
          ./build/bin/server/econserver accttest
          ./build/bin/server/econserver worldtest
          ./build/bin/server/econserver ordertest

      # The same end-to-end check the Windows job runs. A socket layer that compiles and
      # a socket layer that talks are different claims.
      - name: Agent selftest against a live server
        timeout-minutes: 10  # a hung socket fails the run instead of holding it for hours
        run: |
          ./build/bin/server/econserver host 50800 &
          server_pid=$!
          sleep 5
          ./build/bin/agent/econagent selftest 127.0.0.1 50800
          status=$?
          kill $server_pid 2>/dev/null || true
          exit $status

      # Two clients at once, which nothing checked until #107 -- and that is why one
      # account being playable by two connections at the same time (#105) reached main.
      # Deliberately over sockets rather than in-process: the hello handler, the per-name
      # account files and the transport are exactly the parts that only exist there.
      - name: Two clients at once
        timeout-minutes: 10  # a hung socket fails the run instead of holding it for hours
        run: |
          set -e
          ./build/bin/server/econserver host 50801 > mc.log 2>&1 &
          server_pid=$!
          # However this ends -- a failed check under set -e included -- stop the server
          # and show its log. A step that dies without the server's side of the story is
          # the one nobody can diagnose afterwards.
          trap 'kill $server_pid 2>/dev/null || true; echo "--- server log ---"; cat mc.log' EXIT
          # Wait for what the server says, never for a fixed time: a sleep is a guess about
          # how fast this runner is today, and a guess that is wrong once is a flaky step.
          wait_for() {
            for _ in $(seq 1 150); do grep -q "$1" mc.log && return 0; sleep 0.2; done
            echo "timed out waiting for the server to log: $1"; return 1
          }
          # Every client is bounded twice: by its own watchdog (econagent selftest gives
          # up and names what it was waiting for), and here, for a process that will not
          # exit at all.
          agent() { timeout -k 10 300 ./build/bin/agent/econagent "$@"; }
          wait_for "EconSpace server on port"

          # Two people sharing a galaxy. Each has to complete its own scripted run.
          agent selftest 127.0.0.1 50801 alice alice-secret &
          alice=$!
          agent selftest 127.0.0.1 50801 bob bob-secret &
          bob=$!
          wait $alice
          wait $bob

          # One account, one session: a second login for a name displaces the first, and
          # the newcomer still plays normally afterwards. The second login waits until the
          # first has actually joined -- after a fixed three seconds it sometimes had not,
          # and then the "first" displaced the second and the check failed.
          sleep 30 | agent connect 127.0.0.1 50801 carol carol-secret >/dev/null 2>&1 &
          holder=$!
          wait_for "carol joined"
          agent selftest 127.0.0.1 50801 carol carol-secret

          # And the secret is not decoration: the wrong one is refused (#106).
          if agent selftest 127.0.0.1 50801 carol not-the-secret; then
            echo "a wrong secret was accepted"
            exit 1
          fi
          kill $holder 2>/dev/null || true
          grep -q "displaced" mc.log

      # The example in examples/agents is documentation that executes. It runs against a
      # real server here so that it cannot rot: if a tool changes and the example stops
      # working, this goes red, instead of a newcomer finding out on their first evening.
      # The bot reference is generated from the binary (#172). A tool changed without its
      # documentation fails here -- and so does a tool schema a strict MCP client would not
      # accept, which is how this check found that every schema had been malformed.
      - name: The agent reference matches the agent
        run: python3 tools/gen_agent_reference.py ./build/bin/agent/econagent --check

      - name: The example bot plays
        timeout-minutes: 10  # a hung socket fails the run instead of holding it for hours
        run: |
          ./build/bin/server/econserver host 50802 > bot-server.log 2>&1 &
          server_pid=$!
          sleep 5
          timeout 300 python3 examples/agents/mining_bot.py ./build/bin/agent/econagent 127.0.0.1 50802
          status=$?
          kill $server_pid 2>/dev/null || true
          exit $status

  # macOS (#178). The transport has carried a macOS branch since #12 -- SO_NOSIGPIPE on the
  # socket where Linux passes MSG_NOSIGNAL per send -- and raylib and GLSL 330 core both work
  # there, so this job is mostly about Apple Clang, which is strict about different things
  # than GCC. What it cannot check is the picture: a runner has no display. "Builds and
  # passes" is true here; "looks right on a Mac" needs somebody with a Mac.
  macos:
    name: macOS (Apple Clang)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -DWARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Server smoke tests
        run: |
          ./build/bin/server/econserver hosttest
          ./build/bin/server/econserver accttest
          ./build/bin/server/econserver worldtest
          ./build/bin/server/econserver ordertest

      - name: Agent selftest against a live server
        run: |
          ./build/bin/server/econserver host 50800 &
          server_pid=$!
          sleep 5
          ./build/bin/agent/econagent selftest 127.0.0.1 50800
          status=$?
          kill $server_pid 2>/dev/null || true
          exit $status

      - name: The example bot plays
        run: |
          ./build/bin/server/econserver host 50802 > bot-server.log 2>&1 &
          server_pid=$!
          sleep 5
          python3 examples/agents/mining_bot.py ./build/bin/agent/econagent 127.0.0.1 50802
          status=$?
          kill $server_pid 2>/dev/null || true
          exit $status
