name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Whether anything but documentation changed (#475). Every other job needs it and is
  # skipped when the answer is no. A skipped job counts as passed for branch protection,
  # which `paths-ignore` on the trigger would not: it leaves a required check pending
  # forever. docs/agents/reference.md is generated from econagent and checked by the Linux
  # job, so it counts as code.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Classify the diff
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          case "$EVENT" in
            pull_request) range="$BASE...$HEAD_SHA" ;;
            push) range="$BEFORE..$HEAD_SHA" ;;
            *) echo "code=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # A diff that cannot be taken (a new branch, a rewritten history) or comes back
          # empty builds everything rather than guessing.
          if ! files=$(git diff --name-only "$range") || [ -z "$files" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          code=false
          while IFS= read -r f; do
            case "$f" in
              docs/agents/reference.md) code=true ;;
              *.md|documents/*|media/*|LICENSE) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "$files"
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  # Style gate, in its own job so it reports independently of the build.
  #
  # It runs under MSYS2 rather than on a cheaper Ubuntu runner on purpose: clang-format
  # output differs between major versions, so checking with a different build than
  # contributors have locally would fail on code that is correctly formatted. Same
  # toolchain here as in CONTRIBUTING.
  lint:
    name: Formatting
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up MSYS2 / clang-format
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-clang

      - name: Check formatting
        run: |
          clang-format --version
          find src tests \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  build:
    name: Windows (MinGW / MSYS2)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      EXE: .exe  # what tools/ci/ appends to a binary's name
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          # No `update: true`: a full pacman upgrade on every run costs minutes and
          # pins the build to whatever landed upstream today rather than to the
          # packages we actually asked for.
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-ccache

      # raylib and nlohmann/json are fetched and compiled by CMake. They change only
      # when the pinned versions in CMakeLists.txt change, so key the cache on that
      # file: a dependency bump invalidates it, an ordinary commit does not.
      - name: Cache fetched dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      # ccache covers our own sources. CMakeLists picks it up automatically when it is
      # on PATH. Its directory is named explicitly: actions/cache runs outside MSYS2, so
      # its `~` is not MSYS2's home, and ccache on Windows does not use `~/.ccache`
      # anyway -- with the default the cache saved and restored an empty directory and
      # every run compiled everything.
      - name: Cache compiled objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Configure
        # -Werror only in CI: warnings stay visible but non-fatal for local work, while
        # nothing warning-dirty can reach main.
        # A named build type (#341): with none, CMake builds with no optimisation and no
        # symbols, which is neither the build anyone develops with nor the one they ship.
        run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Debug -DWARNINGS_AS_ERRORS=ON

      - name: Build
        # Bounded by the cores, like the other jobs: without -j, MinGW Makefiles compiles one
        # file at a time.
        run: |
          cmake --build build -j "$(nproc)"
          ccache --show-stats

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Server smoke tests
        timeout-minutes: 10  # a hung socket fails the run instead of holding it for hours
        run: |
          ./build/bin/server/econserver.exe hosttest
          ./build/bin/server/econserver.exe accttest
          ./build/bin/server/econserver.exe worldtest
          ./build/bin/server/econserver.exe ordertest
          ./build/bin/server/econserver.exe opstest

      # The agent seam, end to end, against a real server. Deliberately scripted rather
      # than model-driven: a real model would cost money, need a key and answer
      # differently every run, while this proves the part that can actually break --
      # the bridge, the orders, the journal and the round trip.
      - name: Agent selftest against a live server
        timeout-minutes: 10  # a hung socket fails the run instead of holding it for hours
        run: |
          ./build/bin/agent/econagent.exe || true   # usage, non-zero exit
          . tools/ci/server.sh
          start_server agent-server.log
          ./build/bin/agent/econagent.exe selftest 127.0.0.1 $SERVER_PORT
          status=$?
          stop_server
          exit $status

      # Two clients at once (#107), over sockets: one script for both jobs (#359), which
      # says what it checks and why.
      - name: Two clients at once
        timeout-minutes: 10  # a hung socket fails the run instead of holding it for hours
        run: bash tools/ci/two_clients.sh

  # The second platform, and the reason the transport was portable at all (#12). Without
  # a runner that actually compiles it, "should work on Linux" is a claim nobody checks --
  # and the winsock calls it replaced were invisible from Windows.
  linux:
    name: Linux (GCC)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # raylib needs the X11/GL development headers even for a build that never opens a
      # window: the server links it for its timing and file-path helpers.
      - name: Install raylib's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache libasound2-dev libgl1-mesa-dev libglu1-mesa-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxkbcommon-dev \
            libxrandr-dev

      - name: Cache fetched dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Cache compiled objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DWARNINGS_AS_ERRORS=ON

      - name: Build
        # A bare -j starts every compile at once; bound it by the cores, or the runner swaps and hangs.
        run: cmake --build build -j "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Server smoke tests
        timeout-minutes: 10  # a hung socket fails the run instead of holding it for hours
        run: |
          ./build/bin/server/econserver hosttest
          ./build/bin/server/econserver accttest
          ./build/bin/server/econserver worldtest
          ./build/bin/server/econserver ordertest
          ./build/bin/server/econserver opstest

      # The portable package, unpacked away from the source tree, must find its own data/
      # (#399): the dev path is still compiled in, so this is the check that it loses to
      # the copy beside the binary. ldd shows what a headless host has to have installed.
      - name: Portable package runs from elsewhere
        run: |
          set -e
          cmake --build build --target dist
          mkdir -p "$RUNNER_TEMP/pkg"
          tar xzf build/econspace-*-linux.tar.gz -C "$RUNNER_TEMP/pkg"
          dir=$(ls -d "$RUNNER_TEMP"/pkg/econspace-*-linux)
          ldd "$dir/econserver"
          "$dir/econserver" --version
          "$dir/econserver" regiondump 8 2> dist.log > /dev/null
          cat dist.log
          grep -q "beside the executable" dist.log

      # The same end-to-end check the Windows job runs. A socket layer that compiles and
      # a socket layer that talks are different claims.
      - name: Agent selftest against a live server
        timeout-minutes: 10  # a hung socket fails the run instead of holding it for hours
        run: |
          . tools/ci/server.sh
          start_server agent-server.log
          ./build/bin/agent/econagent selftest 127.0.0.1 $SERVER_PORT
          status=$?
          stop_server
          exit $status

      # Two clients at once (#107), over sockets: one script for both jobs (#359), which
      # says what it checks and why.
      - name: Two clients at once
        timeout-minutes: 10  # a hung socket fails the run instead of holding it for hours
        run: bash tools/ci/two_clients.sh --other-data

      # The example in examples/agents is documentation that executes. It runs against a
      # real server here so that it cannot rot: if a tool changes and the example stops
      # working, this goes red, instead of a newcomer finding out on their first evening.
      # The bot reference is generated from the binary (#172). A tool changed without its
      # documentation fails here -- and so does a tool schema a strict MCP client would not
      # accept, which is how this check found that every schema had been malformed.
      - name: The agent reference matches the agent
        run: python3 tools/gen_agent_reference.py ./build/bin/agent/econagent --check

      - name: The example bot plays
        timeout-minutes: 10  # a hung socket fails the run instead of holding it for hours
        run: |
          . tools/ci/server.sh
          start_server bot-server.log
          timeout 300 python3 examples/agents/mining_bot.py ./build/bin/agent/econagent 127.0.0.1 $SERVER_PORT
          status=$?
          # A fresh world's markets all start at their targets, so the trader is told to make
          # the trip anyway: buy, travel, sell, on the same server.
          if [ $status -eq 0 ]; then
            timeout 300 python3 examples/agents/trader_bot.py ./build/bin/agent/econagent 127.0.0.1 $SERVER_PORT --trade-anyway
            status=$?
          fi
          stop_server
          exit $status

  # macOS (#178). The transport has carried a macOS branch since #12 -- SO_NOSIGPIPE on the
  # socket where Linux passes MSG_NOSIGNAL per send -- and raylib and GLSL 330 core both work
  # there, so this job is mostly about Apple Clang, which is strict about different things
  # than GCC. What it cannot check is the picture: a runner has no display. "Builds and
  # passes" is true here; "looks right on a Mac" needs somebody with a Mac.
  # The address and undefined-behaviour sanitizers over the tests and the server's own
  # smoke tests (#341). A server parsing what strangers send is where an out-of-bounds read
  # stops being a crash and starts being a hole; this is the job that sees one before a
  # player does. Warnings are the Linux job's business, so they are not errors here.
  sanitizers:
    name: Linux (ASan + UBSan)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install raylib's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             ccache libasound2-dev libgl1-mesa-dev libglu1-mesa-dev libwayland-dev             libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxkbcommon-dev             libxrandr-dev

      - name: Cache fetched dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/_deps
          key: deps-asan-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Server smoke tests
        timeout-minutes: 15
        run: |
          ./build/bin/server/econserver hosttest
          ./build/bin/server/econserver accttest
          ./build/bin/server/econserver worldtest
          ./build/bin/server/econserver ordertest
          ./build/bin/server/econserver opstest

  macos:
    name: macOS (Apple Clang)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache fetched dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DWARNINGS_AS_ERRORS=ON

      - name: Build
        # A bare -j starts every compile at once; on a 3-core, 7 GB macOS runner that swaps until the job times out.
        run: cmake --build build -j "$(sysctl -n hw.ncpu)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Server smoke tests
        run: |
          ./build/bin/server/econserver hosttest
          ./build/bin/server/econserver accttest
          ./build/bin/server/econserver worldtest
          ./build/bin/server/econserver ordertest
          ./build/bin/server/econserver opstest

      - name: Agent selftest against a live server
        run: |
          . tools/ci/server.sh
          start_server agent-server.log
          ./build/bin/agent/econagent selftest 127.0.0.1 $SERVER_PORT
          status=$?
          stop_server
          exit $status

      - name: The example bot plays
        run: |
          . tools/ci/server.sh
          start_server bot-server.log
          python3 examples/agents/mining_bot.py ./build/bin/agent/econagent 127.0.0.1 $SERVER_PORT
          status=$?
          if [ $status -eq 0 ]; then
            python3 examples/agents/trader_bot.py ./build/bin/agent/econagent 127.0.0.1 $SERVER_PORT --trade-anyway
            status=$?
          fi
          stop_server
          exit $status
