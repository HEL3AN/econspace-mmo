name: release

# A release is a tag (#400): pushing v0.1.0 builds Release on Windows, Linux and macOS, runs the
# tests against exactly those binaries, packs the portable folders and opens a DRAFT GitHub
# Release with them and generated notes. Nothing is published until a person reads the draft
# and presses Publish.
#
# The version is not written here. It is CMakeLists.txt's project(VERSION) and its codename
# table; the tag must name the same number, or the run stops before anything is packed.
#
# Run by hand (workflow_dispatch) it builds and tests the packages and keeps them as the
# run's artifacts. It opens a draft only when asked, and never pushes a tag: a draft names a
# tag that exists only when somebody publishes it.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      draft:
        description: 'Also open a draft release (never published by this workflow)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    name: Windows package (MinGW / MSYS2)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    outputs:
      name: ${{ steps.version.outputs.name }}
      number: ${{ steps.version.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make

      # No cache on purpose: a published build is compiled from nothing but the tagged tree.
      - name: Configure
        run: cmake -S . -B build-release -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DWARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-release -j "$(nproc)"

      - name: Test
        run: ctest --test-dir build-release --output-on-failure

      - name: Server smoke tests
        timeout-minutes: 10
        run: |
          ./build-release/bin/server/econserver.exe hosttest
          ./build-release/bin/server/econserver.exe accttest
          ./build-release/bin/server/econserver.exe worldtest
          ./build-release/bin/server/econserver.exe ordertest
          ./build-release/bin/server/econserver.exe opstest

      # Every binary says the same version, and on a tag it is the tag's.
      - name: Version
        id: version
        run: |
          set -e
          line=$(./build-release/bin/server/econserver.exe --version)
          echo "$line"
          number=$(echo "$line" | sed -n 's/.*(\(.*\))$/\1/p')
          ./build-release/bin/game/econspace.exe --version | grep -qF "($number)"
          ./build-release/bin/agent/econagent.exe --version | grep -qF "($number)"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$number" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the build's version $number (CMakeLists.txt project VERSION)."
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "name=${line% (*}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: |
          set -e
          cmake --build build-release --target dist
          ls -l build-release/econspace-*.zip
          # What the package must carry besides the binaries and data/.
          # (the folder the zip was packed from)
          dir=$(ls -d build-release/dist/econspace-*-windows)
          ls "$dir/README.txt" "$dir/HOSTING.md" "$dir/start-server.bat" "$dir/econserver.exe" "$dir/data/goods.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-windows
          path: build-release/econspace-*-windows.zip
          if-no-files-found: error

  linux:
    name: Linux package (GCC, Ubuntu 22.04)
    # The oldest supported base, not the newest: glibc runs forward and not backward, so a
    # server built here runs on 22.04 and later, and one built on 24.04 would not run on 22.04.
    runs-on: ubuntu-22.04
    outputs:
      number: ${{ steps.version.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install raylib's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libgl1-mesa-dev libglu1-mesa-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxkbcommon-dev \
            libxrandr-dev

      - name: Configure
        run: cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DWARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-release -j "$(nproc)"

      - name: Test
        run: ctest --test-dir build-release --output-on-failure

      - name: Server smoke tests
        timeout-minutes: 10
        run: |
          ./build-release/bin/server/econserver hosttest
          ./build-release/bin/server/econserver accttest
          ./build-release/bin/server/econserver worldtest
          ./build-release/bin/server/econserver ordertest
          ./build-release/bin/server/econserver opstest

      - name: Version
        id: version
        run: |
          set -e
          line=$(./build-release/bin/server/econserver --version)
          echo "$line"
          number=$(echo "$line" | sed -n 's/.*(\(.*\))$/\1/p')
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$number" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the build's version $number."
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # Packed, unpacked away from the source tree, and asked to run: the package finds its
      # own data/ and a client of it is let in by a server of it.
      - name: Pack and run from elsewhere
        timeout-minutes: 10
        run: |
          set -e
          cmake --build build-release --target dist
          pkg=$(ls build-release/econspace-*-linux.tar.gz)
          mkdir -p "$RUNNER_TEMP/pkg"
          tar xzf "$pkg" -C "$RUNNER_TEMP/pkg"
          dir=$(ls -d "$RUNNER_TEMP"/pkg/econspace-*-linux)
          ldd "$dir/econserver"
          "$dir/econserver" --version
          ls "$dir/README.txt" "$dir/HOSTING.md" "$dir/econserver.service" "$dir/data/goods.json"
          (cd "$dir" && ./econserver host 0 > "$RUNNER_TEMP/server.log" 2>&1) &
          trap 'pkill -f "$dir/econserver" || true; kill %1 2>/dev/null || true; cat "$RUNNER_TEMP/server.log"' EXIT
          for _ in $(seq 1 150); do grep -q "EconSpace server on port" "$RUNNER_TEMP/server.log" && break; sleep 0.2; done
          port=$(sed -n 's/.*EconSpace server on port \([0-9]*\).*/\1/p' "$RUNNER_TEMP/server.log")
          timeout -k 10 300 "$dir/econagent" selftest 127.0.0.1 "$port" packaged packaged-secret

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-linux
          path: build-release/econspace-*-linux.tar.gz
          if-no-files-found: error

  macos:
    name: macOS package (Apple Clang, universal)
    # Universal (#478): one archive runs on Apple silicon and on Intel. raylib, GLFW and the
    # rest are built from source here and link only system frameworks, so a second slice
    # costs build time and nothing else. The runner is arm64; the minimum macOS (11) is
    # CMakeLists.txt's CMAKE_OSX_DEPLOYMENT_TARGET. Unsigned until SignPath (#186), which is
    # why the README and the release notes say how to open it.
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      number: ${{ steps.version.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure
        run: >-
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DWARNINGS_AS_ERRORS=ON
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build
        # A bare -j starts every compile at once; on a 3-core, 7 GB runner that swaps.
        run: cmake --build build-release -j "$(sysctl -n hw.ncpu)"

      - name: Test
        run: ctest --test-dir build-release --output-on-failure

      - name: Server smoke tests
        timeout-minutes: 10
        run: |
          ./build-release/bin/server/econserver hosttest
          ./build-release/bin/server/econserver accttest
          ./build-release/bin/server/econserver worldtest
          ./build-release/bin/server/econserver ordertest
          ./build-release/bin/server/econserver opstest

      - name: Version
        id: version
        run: |
          set -e
          line=$(./build-release/bin/server/econserver --version)
          echo "$line"
          number=$(echo "$line" | sed -n 's/.*(\(.*\))$/\1/p')
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$number" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the build's version $number."
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # As on Linux: packed, unpacked away from the source tree, and asked to run. Every
      # binary must carry both slices and ask for nothing newer than macOS 11.
      - name: Pack and run from elsewhere
        timeout-minutes: 15
        run: |
          set -e
          cmake --build build-release --target dist
          pkg=$(ls build-release/econspace-*-macos.tar.gz)
          mkdir -p "$RUNNER_TEMP/pkg"
          tar xzf "$pkg" -C "$RUNNER_TEMP/pkg"
          dir=$(ls -d "$RUNNER_TEMP"/pkg/econspace-*-macos)
          ls -l "$dir"
          ls "$dir/README.txt" "$dir/HOSTING.md" "$dir/data/goods.json"
          for exe in econspace econserver econagent worldeditor; do
            file "$dir/$exe"
            archs=$(lipo -archs "$dir/$exe")
            case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "$exe is not universal: $archs"; exit 1 ;; esac
            minos=$(otool -l "$dir/$exe" | awk '/LC_BUILD_VERSION/{b=1} b&&/minos/{print $2; exit}')
            echo "$exe: $archs, minos $minos"
            [ "$minos" = "11.0" ] || { echo "$exe asks for macOS $minos"; exit 1; }
          done
          otool -L "$dir/econspace"
          "$dir/econserver" --version
          # The Intel slice too, where the runner has Rosetta.
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 "$dir/econserver" --version
          else
            echo "No Rosetta on this runner: the x86_64 slice is checked by lipo only."
          fi
          (cd "$dir" && ./econserver host 0 > "$RUNNER_TEMP/server.log" 2>&1) &
          trap 'pkill -f "$dir/econserver" || true; kill %1 2>/dev/null || true; cat "$RUNNER_TEMP/server.log"' EXIT
          for _ in $(seq 1 150); do grep -q "EconSpace server on port" "$RUNNER_TEMP/server.log" && break; sleep 0.2; done
          port=$(sed -n 's/.*EconSpace server on port \([0-9]*\).*/\1/p' "$RUNNER_TEMP/server.log")
          "$dir/econagent" selftest 127.0.0.1 "$port" packaged packaged-secret

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-macos
          path: build-release/econspace-*-macos.tar.gz
          if-no-files-found: error

  release:
    name: Draft release
    needs: [ windows, linux, macos ]
    if: github.ref_type == 'tag' || inputs.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages
          merge-multiple: true

      - name: Open a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.windows.outputs.name }}
          NUMBER: ${{ needs.windows.outputs.number }}
          LINUX_NUMBER: ${{ needs.linux.outputs.number }}
          MACOS_NUMBER: ${{ needs.macos.outputs.number }}
        run: |
          set -e
          if [ "$NUMBER" != "$LINUX_NUMBER" ] || [ "$NUMBER" != "$MACOS_NUMBER" ]; then
            echo "Windows built $NUMBER, Linux $LINUX_NUMBER and macOS $MACOS_NUMBER"; exit 1
          fi
          ls -l packages
          # Always --draft: publishing is a person's decision. A run by hand names the tag the
          # version would have; a draft does not create it.
          tag="v$NUMBER"
          [ "$GITHUB_REF_TYPE" = "tag" ] && tag="$GITHUB_REF_NAME"
          # What a player needs before the list of changes: which file, and how to open an
          # unsigned build. GitHub appends the generated notes after it.
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          ## Downloads

          - **Windows**: `econspace-*-windows.zip`. Unzip anywhere. Windows may warn that the program is unrecognised: *More info* -> *Run anyway*.
          - **Linux**: `econspace-*-linux.tar.gz`. The same folder is the server for a headless machine: see `HOSTING.md` inside.
          - **macOS** (universal: Apple silicon and Intel, macOS 11 or later): `econspace-*-macos.tar.gz`. The build is not signed yet, so macOS will not open it with a double-click. Either right-click (Control-click) a program in Finder, choose *Open* and confirm, once per program; or clear the quarantine on the whole folder in Terminal: `xattr -dr com.apple.quarantine econspace-*-macos`.

          Each folder has a `README.txt`. A client plays only on a server of the same release.
          NOTES
          gh release create "$tag" packages/* \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
