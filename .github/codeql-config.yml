# CodeQL scope: our sources only.
#
# NOTE: for a compiled language these path filters are a second line of defence, not the
# mechanism. The extractor takes whatever it observes being compiled, so raylib landed in
# the database despite this file — 100 alerts, none of them in our code. What actually
# scopes the analysis is build order: the workflow builds the dependencies before CodeQL
# starts watching, so only our sources are extracted. See #63.
name: EconSpace CodeQL

paths:
  - src
  - tests

paths-ignore:
  - build
  - build-codeql
