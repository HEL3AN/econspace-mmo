# Dependabot keeps the GitHub Actions we pin up to date. Every `uses:` is pinned by full commit
# SHA with a `# vX` comment (OpenSSF Scorecard, #519); Dependabot updates both together.
#
# It cannot see raylib or nlohmann/json: those come in through CMake FetchContent,
# which is not a package manager Dependabot understands. Their versions are pinned
# by hand in CMakeLists.txt and have to be bumped there deliberately.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    labels:
      - tech-debt
