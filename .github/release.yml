# How GitHub groups merged pull requests into release notes, by label. A release drafts
# its full notes from what was merged since the last one; CHANGELOG.md is the short,
# hand-written summary a player reads, kept under its Unreleased heading as PRs land.
changelog:
  exclude:
    labels: [duplicate, invalid, wontfix]
    authors: [dependabot]
  categories:
    - title: Gameplay and world
      labels: [world-building, content, enhancement]
    - title: The look
      labels: [renderer, art]
    - title: Agents and the MCP server
      labels: [agent, ai]
    - title: Multiplayer and networking
      labels: [networking]
    - title: Fixes
      labels: [bug]
    - title: For contributors
      labels: [community, documentation, tooling, tech-debt]
    - title: Everything else
      labels: ["*"]
